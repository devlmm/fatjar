<!--
  fatjar 管理后台 - favicon.svg
  说明：蓝紫渐变背景 + 白色 F 字母，与官网 Logo 一致
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1677ff"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#g)"/>
  <text x="50%" y="50%" font-size="20" font-weight="700" fill="#fff"
        text-anchor="middle" dominant-baseline="central" font-family="sans-serif">F</text>
</svg>
