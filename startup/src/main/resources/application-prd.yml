# ====================================================================================
# application-prd.yml - PRD 环境完整配置（阿里云生产环境）
# ------------------------------------------------------------------------------------
# 本文件包含 PRD 环境所需的全部业务配置，当 fatjar.nacos.enabled=false 时直接使用。
# 当 fatjar.nacos.enabled=true 时，可直接复制本文件内容到 Nacos 的 fatjar-prd 命名空间。
# 所有敏感信息（密钥、密码）务必通过环境变量或 Nacos 覆盖，禁止硬编码到仓库。
# ====================================================================================

# ---------------------------------------------------------------------
# 服务器配置
# ---------------------------------------------------------------------
server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    max-threads: 200
    accept-count: 100

# ---------------------------------------------------------------------
# Spring 通用配置
# ---------------------------------------------------------------------
spring:
  mvc:
    throw-exception-if-no-handler-found: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # -----------------------------------------------------------------
  # 数据源配置（Druid 连接池）- PRD 阿里云（启用 SSL）
  # -----------------------------------------------------------------
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql-prd}:3306/fatjar?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 50
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      filters: stat,wall
      stat-view-servlet:
        enabled: false

  # -----------------------------------------------------------------
  # Redis 配置 - PRD 阿里云
  # -----------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:redis-prd}
      port: 6379
      # 不写 password 空默认值，避免 Redisson 误发 AUTH。生产环境通过环境变量/Naocs 注入真实密码。
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 0

# ---------------------------------------------------------------------
# MyBatis-Plus 配置
# ---------------------------------------------------------------------
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.workspace.fatjar.**.domain
  configuration:
    map-underscore-to-camel-case: true
    # PRD 环境关闭 SQL 打印（禁止泄露 SQL）
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    cache-enabled: true
  global-config:
    db-config:
      id-type: INPUT
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------------------------------------------------------------------
# RocketMQ 配置 - PRD 阿里云
# ---------------------------------------------------------------------
rocketmq:
  name-server: ${ROCKETMQ_NAMESERVER:rocketmq-prd:9876}
  producer:
    group: fatjar-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2

# ---------------------------------------------------------------------
# XXL-JOB 调度配置 - PRD
# ---------------------------------------------------------------------
xxl:
  job:
    enabled: true
    admin:
      addresses: http://xxl-job-admin-prd:8085/xxl-job-admin
    # accessToken 不写空默认值；生产环境务必通过 Nacos/环境变量 xxl.job.accessToken 注入真实 token
    executor:
      appname: fatjar-executor-prd
      port: 9999
      logpath: /app/logs/xxl-job
      logretentiondays: 30

# ---------------------------------------------------------------------
# fatjar 业务自定义配置
# ---------------------------------------------------------------------
fatjar:
  jwt:
    # PRD 环境密钥必须通过环境变量或 Nacos 注入，禁止使用默认值
    secret: ${JWT_SECRET:fatjar-prd-jwt-secret-key-must-override-via-env-or-nacos}
    expire: 86400
  worker-id: ${FATJAR_WORKER_ID:1}
  tenant:
    enabled: false
  web:
    # PRD 环境关闭 Knife4j 文档（安全考虑）
    enable-knife4j: false
  # 环境标识
  env: prd

# ---------------------------------------------------------------------
# Spring Boot Actuator 健康检查
# ---------------------------------------------------------------------
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

# ---------------------------------------------------------------------
# 日志配置：PRD 收敛到 WARN 级别，减少日志量
# ---------------------------------------------------------------------
logging:
  level:
    root: WARN
    com.workspace.fatjar: INFO
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
