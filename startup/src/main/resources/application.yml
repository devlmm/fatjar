# ====================================================================================
# application.yml - 应用引导配置
# ------------------------------------------------------------------------------------
# 配置优先级（从高到低）：
#   ① Nacos 远程配置（application-{env}.yml from FATJAR_GROUP）
#   ② 本地兜底配置（environment/application-{env}.yml，通过 spring.config.import 导入）
#   ③ 本文件（application.yml，Nacos 连接信息等引导配置）
#
# Spring Cloud Alibaba Nacos Config：
#   启动时通过 spring.config.import 从 Nacos 拉取远程配置。
#   namespace 通过 spring.cloud.nacos.config.namespace 属性设置（每个 profile 块覆盖）。
#   Nacos 不可用时启动直接失败（保证配置源正确性）。
#   本地兜底配置放在 environment/ 子目录（不会被 Spring Boot 自动检测），
#   通过 optional:classpath: 导入，文件缺失不阻断启动。
# ====================================================================================
spring:
  application:
    name: fatjar
  # 默认激活 DEV 环境，可通过启动参数 --spring.profiles.active=sit|prd 覆盖
  profiles:
    active: dev
  # -----------------------------------------------------------------
  # Spring Cloud Alibaba Nacos Config 配置中心
  # -----------------------------------------------------------------
  config:
    import:
      # ① 从 Nacos 拉取 DEV 环境配置（最高优先级）
      - nacos:application-dev.yml?group=FATJAR_GROUP
      # ② 本地兜底配置（Nacos 配置不足时由本文件补充）
      - optional:classpath:/environment/application-dev.yml
  cloud:
    nacos:
      config:
        # Nacos 服务地址：DEV 默认 localhost:8848；SIT/PRD 通过 NACOS_ADDR 环境变量覆盖
        server-addr: ${NACOS_ADDR:localhost:8848}
        # Nacos 鉴权账号（默认 nacos/nacos）
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        # DEV 环境命名空间
        namespace: fatjar-dev

# ========== 各环境 Nacos 命名空间 + 本地兜底覆盖 ==========
# SIT/PRD 通过 profile 分块覆盖 namespace、Nacos import 和本地兜底文件。

---
# SIT 环境配置
spring:
  config:
    activate:
      on-profile: sit
    import:
      - nacos:application-sit.yml?group=FATJAR_GROUP
      - optional:classpath:/environment/application-sit.yml
  cloud:
    nacos:
      config:
        namespace: fatjar-sit

---
# PRD 环境配置
spring:
  config:
    activate:
      on-profile: prd
    import:
      - nacos:application-prd.yml?group=FATJAR_GROUP
      - optional:classpath:/environment/application-prd.yml
  cloud:
    nacos:
      config:
        namespace: fatjar-prd
