# ====================================================================================
# application.yml - 引导配置（只负责 Nacos 开关与连接信息，优先级最高）
# ------------------------------------------------------------------------------------
# 核心开关：fatjar.nacos.enabled
#   true  → 启用 Nacos 配置中心，直接读取 Nacos 配置，忽略本地 application-{env}.yml 的业务配置
#   false → 禁用 Nacos，直接读取本地 application-{env}.yml 作为完整配置源
# 其他所有业务配置（数据源、Redis、MyBatis等）均在 application-{env}.yml 或 Nacos 中。
# ====================================================================================
spring:
  application:
    name: fatjar
  # 默认激活 DEV 环境，可通过启动参数 --spring.profiles.active=sit|prd 覆盖
  profiles:
    active: dev

# =========================================
# Nacos 总开关（用户只需要改这一个值）
# =========================================
fatjar:
  nacos:
    # true=读Nacos（忽略本地application-{env}.yml业务配置），false=读本地yml
    enabled: false

# =========================================
# Nacos 配置中心连接信息（com.alibaba.boot）
# nacos.config.bootstrap.enable / remote-first 跟随 fatjar.nacos.enabled 联动
# =========================================
nacos:
  config:
    # Nacos 服务地址：DEV 默认 192.168.3.100:8848；SIT/PRD 通过 NACOS_ADDR 环境变量覆盖
    server-addr: ${NACOS_ADDR:192.168.3.100:8848}
    # 配置分组
    group: FATJAR_GROUP
    # 配置文件类型
    type: yaml
    # 启用自动刷新
    auto-refresh: true
    # 跟随总开关：开启Nacos时远程优先，覆盖本地一切配置
    remote-first: ${fatjar.nacos.enabled:false}
    # 早期加载与总开关联动
    bootstrap:
      enable: ${fatjar.nacos.enabled:false}
      log-enable: ${fatjar.nacos.enabled:false}

# ========== 各 profile 对应的 Nacos namespace 与 data-ids ==========
# 即使 fatjar.nacos.enabled=false 也保留声明，便于随时切回 Nacos 模式

---
# DEV 环境 Nacos 元信息
spring:
  config:
    activate:
      on-profile: dev
nacos:
  config:
    namespace: fatjar-dev
    # 只拉取 application-dev.yml（包含完整配置，用户直接复制 startup 下的同名文件即可）
    data-ids: application-dev.yml

---
# SIT 环境 Nacos 元信息
spring:
  config:
    activate:
      on-profile: sit
nacos:
  config:
    namespace: fatjar-sit
    data-ids: application-sit.yml

---
# PRD 环境 Nacos 元信息
spring:
  config:
    activate:
      on-profile: prd
nacos:
  config:
    namespace: fatjar-prd
    data-ids: application-prd.yml
