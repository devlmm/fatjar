# ====================================================================================
# application-sit.yml - SIT 环境完整配置（阿里云集成测试环境）
# ------------------------------------------------------------------------------------
# 本文件包含 SIT 环境所需的全部业务配置，当 fatjar.nacos.enabled=false 时直接使用。
# 当 fatjar.nacos.enabled=true 时，可直接复制本文件内容到 Nacos 的 fatjar-sit 命名空间。
# 所有中间件地址使用环境变量占位，便于在 CI/CD 或容器中注入真实地址。
# ====================================================================================

# ---------------------------------------------------------------------
# 服务器配置
# ---------------------------------------------------------------------
server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    max-threads: 200
    accept-count: 100

# ---------------------------------------------------------------------
# Spring 通用配置
# ---------------------------------------------------------------------
spring:
  mvc:
    throw-exception-if-no-handler-found: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # -----------------------------------------------------------------
  # 数据源配置（Druid 连接池）- SIT 阿里云
  # -----------------------------------------------------------------
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql-sit}:3306/fatjar?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      filters: stat,wall
      stat-view-servlet:
        enabled: true
        login-username: druid
        login-password: druid123

  # -----------------------------------------------------------------
  # Redis 配置 - SIT 阿里云
  # -----------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:redis-sit}
      port: 6379
      # 不写 password 空默认值，避免 Redisson 误发 AUTH。需要密码时用环境变量/Naocs 注入。
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0

# ---------------------------------------------------------------------
# MyBatis-Plus 配置
# ---------------------------------------------------------------------
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.workspace.fatjar.**.domain
  configuration:
    map-underscore-to-camel-case: true
    # SIT 环境关闭 SQL 打印
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    cache-enabled: true
  global-config:
    db-config:
      id-type: INPUT
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------------------------------------------------------------------
# RocketMQ 配置 - SIT 阿里云
# ---------------------------------------------------------------------
rocketmq:
  name-server: ${ROCKETMQ_NAMESERVER:rocketmq-sit:9876}
  producer:
    group: fatjar-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2

# ---------------------------------------------------------------------
# XXL-JOB 调度配置 - SIT
# ---------------------------------------------------------------------
xxl:
  job:
    enabled: true
    admin:
      addresses: http://xxl-job-admin-sit:8085/xxl-job-admin
    # accessToken 不写空默认值；需要鉴权时通过 Nacos/环境变量注入
    executor:
      appname: fatjar-executor-sit
      port: 9999
      logpath: /app/logs/xxl-job
      logretentiondays: 30

# ---------------------------------------------------------------------
# fatjar 业务自定义配置
# ---------------------------------------------------------------------
fatjar:
  jwt:
    # SIT 环境密钥，建议通过 Nacos 或环境变量覆盖
    secret: ${JWT_SECRET:fatjar-sit-jwt-secret-key-please-change-in-nacos}
    expire: 86400
  worker-id: ${FATJAR_WORKER_ID:1}
  tenant:
    enabled: false
  web:
    # SIT 环境可开启 Knife4j 文档便于联调
    enable-knife4j: true
  # 环境标识
  env: sit

# ---------------------------------------------------------------------
# Spring Boot Actuator 健康检查
# ---------------------------------------------------------------------
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

# ---------------------------------------------------------------------
# 日志配置：SIT 收敛到 INFO 级别
# ---------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.workspace.fatjar: INFO
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
