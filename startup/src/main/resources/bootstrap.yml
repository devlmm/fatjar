# ====================================================================================
# bootstrap.yml - Nacos 配置中心引导配置（最高优先级加载）
# ------------------------------------------------------------------------------------
# 加载顺序：bootstrap.yml -> application.yml -> application-{env}.yml -> Nacos 配置
# 配置优先级：Nacos > application-{env}.yml > application.yml
# 命名空间：fatjar-dev / fatjar-sit / fatjar-prd（与 nacos-init.sh 一致）
# ====================================================================================
spring:
  application:
    name: fatjar
  profiles:
    # 默认激活 dev 环境，可通过 --spring.profiles.active=prd 覆盖
    active: dev
  cloud:
    nacos:
      # Nacos 服务地址（DEV 本地，SIT/PRD 阿里云内网，通过环境变量覆盖）
      server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        # 命名空间 ID（必须与 nacos-init.sh 创建的命名空间一致）
        namespace: ${NACOS_NAMESPACE:fatjar-dev}
        # 配置文件扩展名
        file-extension: yml
        # 启用 Nacos 配置自动刷新
        refresh-enabled: true
        # 共享配置：application-common.yml（所有环境共享的数据源/Redis/MQ 等配置）
        shared-configs:
          - data-id: application-common.yml
            refresh: true

# Nacos 配置 Spring Boot Starter 配置（com.alibaba.boot:nacos-config-spring-boot-starter）
nacos:
  config:
    server-addr: ${NACOS_ADDR:localhost:8848}
    namespace: ${NACOS_NAMESPACE:fatjar-dev}
