# =====================================================================
# fatjar Nginx 反向代理配置模板
# ---------------------------------------------------------------------
# 职责：
#   1. 托管 admin-vue3 前端构建产物（dist/）
#   2. 反向代理 /api → 后端 Spring Boot（去掉 /api 前缀）
#   3. SPA History 模式支持（前端路由 fallback 到 index.html）
#   4. Gzip 压缩、静态资源缓存
#
# 架构：
#   浏览器 → Nginx:80
#     ├─ /api/*     → proxy_pass http://fatjar-app:8080/* （去掉 /api）
#     └─ /*         → 前端静态文件（admin-vue3/dist/）
#
# 使用方式：
#   Docker：挂载本文件到 nginx 容器 /etc/nginx/conf.d/default.conf
#   独立部署：复制到 /etc/nginx/conf.d/ 下，nginx -s reload
# =====================================================================

# 上游：后端 Spring Boot 服务
upstream fatjar-backend {
    # Docker 网络内通过服务名访问；独立部署改为 127.0.0.1:8080
    server fatjar-app:8080;
}

server {
    listen       80;
    server_name  _;   # SIT/PRD 替换为真实域名，如 sit.api.fatjar.com

    # 客户端上传最大 body（文件上传场景）
    client_max_body_size 50m;

    # -----------------------------------------------------------------
    # 1. 后端 API 反向代理
    #    /api/auth/login → http://fatjar-backend/auth/login
    # -----------------------------------------------------------------
    location /api/ {
        proxy_pass http://fatjar-backend/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # -----------------------------------------------------------------
    # 2. 前端静态文件（admin-vue3 构建产物）
    #     Docker 部署时通过 volumes 挂载 dist/ 到 /usr/share/nginx/html
    # -----------------------------------------------------------------
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;   # SPA History 模式兜底
    }

    # -----------------------------------------------------------------
    # 3. 静态资源长缓存（Vite 构建产物带 hash，可安全缓存）
    # -----------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # -----------------------------------------------------------------
    # 4. Gzip 压缩
    # -----------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # -----------------------------------------------------------------
    # 5. 健康检查端点（Docker/K8s 探活用）
    # -----------------------------------------------------------------
    location /nginx-health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
