# =====================================================================
# fatjar K8s 部署 - Secret 敏感配置
# 作用：存放密码/密钥等敏感信息，base64 编码（非加密，仅编码）
# 包含：MYSQL_PASSWORD/REDIS_PASSWORD/JWT_SECRET
# 注意：base64 编码不等于加密，生产环境应启用 RBAC 限制 Secret 访问权限
#      或使用云厂商 KMS（如阿里云 KMS）+ CSI Driver 注入
# 应用方式：kubectl apply -f secret.yaml -n fatjar
# =====================================================================
apiVersion: v1
kind: Secret
metadata:
  name: fatjar-secret
  namespace: fatjar
  labels:
    app.kubernetes.io/name: fatjar
    app.kubernetes.io/component: secret
type: Opaque
# data 字段值必须 base64 编码，可用 echo -n 'value' | base64 生成
data:
  # MySQL 密码：明文 root，base64 编码后为 cm9vdA==
  # 生产环境必须替换为强密码，并通过外部 Secret 管理系统注入
  MYSQL_PASSWORD: "cm9vdA=="

  # Redis 密码：开发环境为空字符串
  # 生产环境应设置强密码，base64 编码空字符串为空
  REDIS_PASSWORD: ""

  # JWT 签名密钥：明文 fatjar-default-jwt-secret-key-please-change-in-production
  # base64 编码后为下方值
  JWT_SECRET: "ZmF0amFyLWRlZmF1bHQtand0LXNlY3JldC1rZXktcGxlYXNlLWNoYW5nZS1pbi1wcm9kdWN0aW9u"
