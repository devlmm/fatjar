# =====================================================================
# fatjar DEV 环境覆盖配置（本地内网开发环境）
# DataId：application-dev.yml
# 命名空间 ID：fatjar-dev
# 说明：覆盖 application-common.yml 中需要本地化的字段
# DEV 环境运行在开发者本地机器或本地内网，所有中间件地址使用 localhost
# =====================================================================

# ---------------------------------------------------------------------
# Spring 覆盖：本地中间件地址
# 这里直接通过覆盖环境变量默认值，让 application-common.yml 引用本地地址
# ---------------------------------------------------------------------
spring:
  cloud:
    nacos:
      config:
        # DEV 环境命名空间 ID 严格使用 fatjar-dev
        namespace: fatjar-dev
      discovery:
        namespace: fatjar-dev
  # 本地 Redis
  data:
    redis:
      host: localhost
      port: 6379

# ---------------------------------------------------------------------
# 中间件本地地址（覆盖 application-common.yml 的默认值）
# ---------------------------------------------------------------------
rocketmq:
  name-server: localhost:9876

xxl:
  job:
    admin:
      # 本地 XXL-JOB 调度中心（docker compose 端口映射 8085:8080）
      addresses: http://localhost:8085/xxl-job-admin

# ---------------------------------------------------------------------
# 日志级别：DEV 环境使用 INFO，便于排查问题
# ---------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.fatjar: DEBUG
    org.springframework.web: INFO

# ---------------------------------------------------------------------
# 环境标识
# ---------------------------------------------------------------------
fatjar:
  env: dev
