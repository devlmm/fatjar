# =====================================================================
# fatjar 通用配置（所有环境共享，DEV/SIT/PRD 三环境通用引用）
# DataId：application-common.yml
# 说明：本文件存放各环境公共配置，环境差异部分由 application-{env}.yml 覆盖
# 配置优先级（高到低）：Nacos 命名空间配置 > application-{env}.yml > application.yml
# 主键策略：id-type=INPUT（应用层雪花算法填充，非数据库自增）
# =====================================================================

# ---------------------------------------------------------------------
# Spring 配置：数据源（Druid 连接池）
# MySQL 主机通过环境变量 MYSQL_HOST 注入，默认 mysql（docker 服务名）
# 用户/密码通过环境变量覆盖，便于不同环境注入不同凭证
# 数据库架构：单 MySQL 实例 + 多数据库（auth/erp/oa/crm/ems），以 fatjar 为连接锚定库
#   - JDBC URL 指向 fatjar 库（空库，仅用于建立连接）
#   - 各业务表通过 @TableName("db.table") 跨库引用，如 auth.sys_user / erp.product
#   - 单数据源 -> 单 SqlSessionFactory -> 单 TransactionManager -> 本地事务 @Transactional
#   - 跨库操作在同一 MySQL 实例内，本地事务自动覆盖，无需分布式事务框架
# ---------------------------------------------------------------------
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/fatjar?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    druid:
      # 初始化连接数、最小空闲、最大活跃
      initial-size: 5
      min-idle: 5
      max-active: 20
      # 获取连接超时（毫秒）
      max-wait: 60000
      # 检测间隔（毫秒）
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      # 校验查询，使用 Druid 内置校验
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # 监控统计、防 SQL 注入过滤器
      filters: stat,wall
      stat-view-servlet:
        enabled: true
        # Druid 监控页登录账号
        login-username: druid
        login-password: druid123

  # -----------------------------------------------------------------
  # Redis 配置：缓存与分布式锁
  # 主机通过环境变量 REDIS_HOST 注入，默认 redis（docker 服务名）
  # -----------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0

  # -----------------------------------------------------------------
  # Nacos 配置中心：本配置由 bootstrap.yml 引导加载
  # 这里仅声明命名空间归属，实际 namespace 由启动环境决定
  # -----------------------------------------------------------------
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yml
        # 命名空间由各环境覆盖，DEV 默认 fatjar-dev
        namespace: fatjar-dev
        group: FATJAR_GROUP
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: fatjar-dev
        group: FATJAR_GROUP

# ---------------------------------------------------------------------
# MyBatis-Plus 配置
# mapper-locations：扫描 jar 内 mapper 目录下所有 XML（classpath*: 支持多 jar）
# id-type: INPUT 主键由应用层填充（雪花算法），与 BaseEntity @TableId(type=INPUT) 一致
# logic-delete-field: deleted 逻辑删除字段，统一字段名
# ---------------------------------------------------------------------
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.fatjar.**.entity
  configuration:
    # 驼峰映射：user_name -> userName
    map-underscore-to-camel-case: true
    # 控制台打印 SQL（生产环境关闭，环境覆盖中处理）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    cache-enabled: true
  global-config:
    db-config:
      # 主键策略：INPUT（应用层填充，非数据库自增）
      id-type: INPUT
      # 逻辑删除字段
      logic-delete-field: deleted
      # 逻辑已删值（默认 1）
      logic-delete-value: 1
      # 逻辑未删值（默认 0）
      logic-not-delete-value: 0

# ---------------------------------------------------------------------
# RocketMQ 配置：消息中间件
# name-server 通过环境变量注入，默认 rocketmq:9876（docker 服务名）
# ---------------------------------------------------------------------
rocketmq:
  name-server: ${ROCKETMQ_NAMESERVER:rocketmq:9876}
  producer:
    # 生产组名（集群部署需相同组名）
    group: fatjar-producer-group
    # 发送消息超时（毫秒）
    send-message-timeout: 3000
    # 同步发送失败重试次数
    retry-times-when-send-failed: 2
    # 异步发送失败重试次数
    retry-times-when-send-async-failed: 2

# ---------------------------------------------------------------------
# XXL-JOB 调度配置
# admin addresses：调度中心地址，多个用逗号分隔
# executor port：9999（避免与 RocketMQ Broker Proxy 8080 冲突，也避免占用业务端口）
# ---------------------------------------------------------------------
xxl:
  job:
    admin:
      # 调度中心地址，默认 docker 服务名 xxl-job-admin
      addresses: ${XXL_JOB_ADMIN:http://xxl-job-admin:8080/xxl-job-admin}
    accessToken: ${XXL_JOB_TOKEN:}
    executor:
      # 执行器 AppName，调度中心需创建对应 AppName
      appname: fatjar-executor
      # 执行器端口：9999（注意不要与业务端口 8080 冲突）
      port: 9999
      # 执行器日志路径
      logpath: /app/logs/xxl-job
      logretentiondays: 30

# ---------------------------------------------------------------------
# fatjar 业务自定义配置
# JWT 密钥/过期时间：JWT_SECRET 通过环境变量注入，避免硬编码
# ---------------------------------------------------------------------
fatjar:
  jwt:
    # JWT 签名密钥（生产环境必须通过环境变量覆盖）
    secret: ${JWT_SECRET:fatjar-default-jwt-secret-key-please-change-in-production}
    # 过期时间（秒）：86400 = 1 天
    expire: 86400
  # 雪花算法 worker-id（多实例部署需保证唯一，避免 ID 重复）
  worker-id: ${FATJAR_WORKER_ID:1}

# ---------------------------------------------------------------------
# Spring Boot Actuator 管理端点配置
# 管理端口 8081 与业务端口 8080 分离，避免业务/管理流混合
# K8s readinessProbe/livenessProbe 探针走 8081/actuator/health
# ---------------------------------------------------------------------
management:
  server:
    # 管理端口独立，便于安全隔离
    port: 8081
  endpoints:
    web:
      exposure:
        # 暴露 health/info/prometheus 端点
        include: health,info,prometheus,metrics
  endpoint:
    health:
      # 显示健康详情（生产环境可关闭）
      show-details: always

# ---------------------------------------------------------------------
# 服务器配置：业务端口 8080
# ---------------------------------------------------------------------
server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    # Tomcat 最大线程数
    max-threads: 200
    accept-count: 100

# ---------------------------------------------------------------------
# 日志配置（默认 INFO，环境覆盖中按需调整）
# ---------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.fatjar: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
