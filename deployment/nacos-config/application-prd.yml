# =====================================================================
# fatjar PRD 环境覆盖配置（阿里云生产环境）
# DataId：application-prd.yml
# 命名空间 ID：fatjar-prd
# 说明：覆盖 application-common.yml 中 PRD 环境相关字段
# PRD 环境部署在阿里云生产 VPC，使用生产地址占位
# 日志级别 WARN，降低日志量、提升吞吐
# =====================================================================

# ---------------------------------------------------------------------
# Spring 覆盖：阿里云生产 Redis 地址占位
# ---------------------------------------------------------------------
spring:
  cloud:
    nacos:
      config:
        # PRD 环境命名空间 ID 严格使用 fatjar-prd
        namespace: fatjar-prd
      discovery:
        namespace: fatjar-prd
  # 阿里云生产 Redis（占位地址，按实际替换）
  data:
    redis:
      host: r-xxx-prd.redis.rds.aliyuncs.com
      port: 6379

# ---------------------------------------------------------------------
# 阿里云生产 RocketMQ（占位地址，按实际替换）
# ---------------------------------------------------------------------
rocketmq:
  name-server: 172.16.x.x:9876

xxl:
  job:
    admin:
      # PRD 环境调度中心地址（生产内网，多实例高可用）
      addresses: http://xxl-job-prd:8080/xxl-job-admin

# ---------------------------------------------------------------------
# 日志级别：PRD 环境使用 WARN，减少日志量
# 仅打印 WARN 及以上级别，错误可由 ELK 采集
# ---------------------------------------------------------------------
logging:
  level:
    root: WARN
    com.fatjar: WARN
    org.springframework.web: WARN
    # 关闭 MyBatis SQL 打印（生产环境不应打印 SQL）
    com.fatjar.**.mapper: WARN

# ---------------------------------------------------------------------
# 环境标识
# ---------------------------------------------------------------------
fatjar:
  env: prd
