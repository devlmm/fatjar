# =====================================================================
# fatjar SIT 环境覆盖配置（阿里云集成测试环境）
# DataId：application-sit.yml
# 命名空间 ID：fatjar-sit
# 说明：覆盖 application-common.yml 中 SIT 环境相关字段
# SIT 环境部署在阿里云 VPC 内网，使用内网域名/地址占位
# =====================================================================

# ---------------------------------------------------------------------
# Spring 覆盖：阿里云内网 Redis 地址占位
# ---------------------------------------------------------------------
spring:
  cloud:
    nacos:
      config:
        # SIT 环境命名空间 ID 严格使用 fatjar-sit
        namespace: fatjar-sit
      discovery:
        namespace: fatjar-sit
  # 阿里云内网 Redis（占位地址，按实际替换）
  data:
    redis:
      host: r-xxx-sit.redis.rds.aliyuncs.com
      port: 6379

# ---------------------------------------------------------------------
# 阿里云内网 RocketMQ（占位地址，按实际替换）
# 如使用阿里云 ONS/MQ for Apache RocketMQ，请填实际 NameServer 地址
# ---------------------------------------------------------------------
rocketmq:
  name-server: 172.16.x.x:9876

xxl:
  job:
    admin:
      # SIT 环境调度中心地址（内网）
      addresses: http://xxl-job-sit:8080/xxl-job-admin

# ---------------------------------------------------------------------
# 日志级别：SIT 环境 INFO，保留必要排查信息
# ---------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.fatjar: INFO
    org.springframework.web: WARN

# ---------------------------------------------------------------------
# 环境标识
# ---------------------------------------------------------------------
fatjar:
  env: sit
