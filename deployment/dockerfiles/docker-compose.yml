# =====================================================================
# fatjar 企业云原生大单体业务管理系统 - Docker Compose 编排文件
# 编排服务：MySQL/Redis/RocketMQ(NameServer+Broker+Dashboard)/Nacos/XXL-JOB Admin/fatjar-app
# 端口冲突解决方案：
#   1. RocketMQ Broker Proxy 8080 与 fatjar-app 8080 冲突 → RocketMQ 端口映射 8084:8080
#   2. XXL-JOB Admin 8080 与 fatjar-app 8080 冲突 → XXL-JOB 端口映射 8085:8080
# 启动方式：docker compose up -d
# 销毁方式：docker compose down -v（-v 同时清理卷）
# =====================================================================

version: '3.8'

# ---------------------------------------------------------------------
# 自定义网络：fatjar-net，所有服务在此网络内可通过服务名互访
# 例如 fatjar-app 可通过 mysql:3306 访问 MySQL
# ---------------------------------------------------------------------
networks:
  fatjar-net:
    driver: bridge
    name: fatjar-net

# ---------------------------------------------------------------------
# 数据卷：持久化中间件数据，避免容器销毁后数据丢失
# ---------------------------------------------------------------------
volumes:
  mysql-data:        # MySQL 数据卷
    name: fatjar-mysql-data
  redis-data:        # Redis 数据卷
    name: fatjar-redis-data
  nacos-data:        # Nacos 数据卷
    name: fatjar-nacos-data
  rmq-store:         # RocketMQ 存储卷
    name: fatjar-rmq-store
  xxl-job-logs:      # XXL-JOB 日志卷
    name: fatjar-xxl-job-logs

services:

  # ===================================================================
  # 1. MySQL 数据库（单实例多库：fatjar 锚定库 + auth/erp/oa/crm/ems 业务库）
  # ===================================================================
  mysql:
    image: mysql:8.0
    container_name: fatjar-mysql
    restart: unless-stopped
    # 端口映射：宿主机 3306 -> 容器 3306
    ports:
      - "3306:3306"
    environment:
      # root 密码通过环境变量注入，默认 root
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      # 自动创建锚定库 fatjar（空库，仅用于 JDBC URL 连接）
      # 业务库 auth/erp/oa/crm/ems 由 schema.sql 的 CREATE DATABASE 语句创建
      MYSQL_DATABASE: fatjar
      # 字符集与排序规则
      TZ: Asia/Shanghai
      LANG: C.UTF-8
    command:
      # MySQL 启动参数：字符集 utf8mb4、排序规则 utf8mb4_unicode_ci（区分大小写弱）
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --lower_case_table_names=1
    volumes:
      # 数据持久化
      - mysql-data:/var/lib/mysql
      # 启动时自动执行 schema.sql 和 data.sql 初始化（仅首次创建容器时执行）
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    networks:
      - fatjar-net
    healthcheck:
      # 健康检查：每 10 秒 ping 一次 mysqladmin
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================================================
  # 2. Redis 缓存
  # ===================================================================
  redis:
    image: redis:7-alpine
    container_name: fatjar-redis
    restart: unless-stopped
    # 端口映射：宿主机 6379 -> 容器 6379
    ports:
      - "6379:6379"
    # 启动命令：开启 AOF 持久化，设置空密码（生产环境通过环境变量覆盖）
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    networks:
      - fatjar-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================================================
  # 3. RocketMQ NameServer（注册中心）
  # ===================================================================
  rmqnamesrv:
    image: apache/rocketmq:5.1.3
    container_name: fatjar-rmqnamesrv
    restart: unless-stopped
    # 端口映射：9876 -> 9876（NameServer 默认端口）
    ports:
      - "9876:9876"
    # 启动命令：以 NameServer 模式启动
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-server -Xms512m -Xmx512m -Xmn128m"
    volumes:
      - rmq-store:/home/rocketmq/store
    networks:
      - fatjar-net
    healthcheck:
      test: ["CMD-SHELL", "netstat -an | grep 9876 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================================================
  # 4. RocketMQ Broker（消息代理）
  # 注意：Broker Proxy 默认监听 8080，与 fatjar-app 8080 冲突
  #   → 宿主机端口映射为 8084:8080（宿主机 8084 -> 容器 8080）
  # ===================================================================
  rmqbroker:
    image: apache/rocketmq:5.1.3
    container_name: fatjar-rmqbroker
    restart: unless-stopped
    ports:
      # Broker 主端口 10911、HA 端口 10909、DR 端口 10912
      - "10911:10911"
      - "10909:10909"
      - "10912:10912"
      # 关键：Broker Proxy 端口 8080 映射到宿主机 8084，避免与 fatjar-app 8080 冲突
      - "8084:8080"
    environment:
      # 指向 NameServer 地址（容器内通过服务名访问）
      NAMESRV_ADDR: "rmqnamesrv:9876"
      JAVA_OPT_EXT: "-server -Xms512m -Xmx512m -Xmn128m"
    # 启动命令：以 Broker 模式启动并启用 Proxy（5.x 特性）
    command: sh mqbroker -n rmqnamesrv:9876 --enable-proxy
    volumes:
      - rmq-store:/home/rocketmq/store
    depends_on:
      rmqnamesrv:
        condition: service_started
    networks:
      - fatjar-net

  # ===================================================================
  # 5. RocketMQ Dashboard（监控控制台）
  # 注意：Dashboard 默认端口 8080 与 fatjar-app 8080 冲突
  #   → 宿主机端口映射为 8086:8080，避免与 Broker Proxy 8084 和 fatjar-app 8080 冲突
  # ===================================================================
  rmqdashboard:
    image: apache/rocketmq-dashboard:1.0.0
    container_name: fatjar-rmqdashboard
    restart: unless-stopped
    ports:
      # Dashboard 8080 映射到宿主机 8086（8084 已被 Broker Proxy 占用）
      - "8086:8080"
    environment:
      # 指向 NameServer
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rmqnamesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false"
    depends_on:
      rmqnamesrv:
        condition: service_started
    networks:
      - fatjar-net

  # ===================================================================
  # 6. Nacos 配置/注册中心
  # ===================================================================
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: fatjar-nacos
    restart: unless-stopped
    ports:
      # 8848：HTTP API / 控制台，9848：gRPC（2.x 客户端必须）
      - "8848:8848"
      - "9848:9848"
    environment:
      # 单机模式（教学用，生产环境应集群部署）
      MODE: standalone
      # 关闭鉴权（开发环境便捷，生产应启用）
      NACOS_AUTH_ENABLE: "false"
      # 内嵌 derby 数据库（生产环境应改用 MySQL 持久化）
      SPRING_DATASOURCE_PLATFORM: ""
      JVM_XMS: "512m"
      JVM_XMX: "512m"
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - fatjar-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===================================================================
  # 7. XXL-JOB Admin 调度中心
  # 注意：Admin 默认端口 8080 与 fatjar-app 8080 冲突
  #   → 宿主机端口映射为 8085:8080
  # ===================================================================
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.0
    container_name: fatjar-xxl-job-admin
    restart: unless-stopped
    ports:
      # 关键：XXL-JOB Admin 8080 映射到宿主机 8085，避免与 fatjar-app 8080 冲突
      - "8085:8080"
    environment:
      # 指向 MySQL 数据库（XXL-JOB 元数据库需提前初始化，此处用同一 MySQL 实例）
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD:-root}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - xxl-job-logs:/data/applogs
    networks:
      - fatjar-net

  # ===================================================================
  # 8. fatjar 业务应用（核心服务）
  # ===================================================================
  fatjar-app:
    # 镜像名：本地构建的 fatjar-startup:1.0.0
    image: fatjar-startup:1.0.0
    container_name: fatjar-app
    restart: unless-stopped
    ports:
      # 8080：业务 HTTP，8081：Actuator 管理端口，9999：XXL-JOB 执行器
      - "8080:8080"
      - "8081:8081"
      - "9999:9999"
    environment:
      # 激活的 Spring profile（dev/sit/prd）
      SPRING_PROFILES_ACTIVE: dev
      # 中间件地址：通过服务名访问同网络内服务
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ROCKETMQ_NAMESERVER: rmqnamesrv:9876
      NACOS_ADDR: nacos:8848
      XXL_JOB_ADMIN: http://xxl-job-admin:8080/xxl-job-admin
      JWT_SECRET: ${JWT_SECRET:-fatjar-default-jwt-secret-key-please-change-in-production}
      FATJAR_WORKER_ID: 1
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      nacos:
        condition: service_healthy
      rmqbroker:
        condition: service_started
    networks:
      - fatjar-net
    # JVM 参数：限制堆内存占容器内存 75%，使用容器感知
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
